# Niezależna kopia bazy produkcyjnej do Cloudflare R2.
#
# Railway ma własne backupy wolumenu (o ile plan je obejmuje), ale ta kopia
# leży POZA Railwayem: skasowany serwis, błędna migracja albo pomyłkowy
# `accounts:reset` nie zabierają jej razem z bazą. Codziennie 03:15 UTC
# i ręcznie z zakładki Actions („Run workflow").
#
# Sekrety repozytorium (Settings → Secrets and variables → Actions):
#   DATABASE_PUBLIC_URL  — DATABASE_PUBLIC_URL serwisu Postgres na Railway
#                          (publiczny proxy; NIE wewnętrzny railway.internal)
#   R2_BACKUP_ENDPOINT   — https://<account-id>.r2.cloudflarestorage.com
#   R2_BACKUP_BUCKET     — osobny bucket (nie ten od zdjęć), bez publicznego dostępu
#   R2_BACKUP_ACCESS_KEY_ID / R2_BACKUP_SECRET_ACCESS_KEY — token R2 tylko do tego bucketa
#
# Klient pg_dump musi być w wersji ≥ serwera: Railway ma Postgresa 17, a
# ubuntu-latest wozi 16 — stąd instalacja z repozytorium PGDG.
#
# Każdy przebieg odtwarza świeży zrzut do tymczasowego Postgresa 17 na
# runnerze i liczy tabele oraz konta — kopia, której nikt nie odtworzył,
# jest tylko nadzieją. Zrzut zawiera dane osobowe, więc przed wysyłką jest
# szyfrowany kluczem publicznym age (sekret BACKUP_AGE_PUBLIC_KEY, „age1…");
# klucz prywatny leży wyłącznie u Rafała (menedżer haseł). Bez sekretu
# zrzut idzie jawnie z ostrzeżeniem w logu — kopia jest ważniejsza niż
# szyfrowanie, ale ma to być stan przejściowy.
#
# Odtworzenie:
#   aws s3 cp s3://<bucket>/weekly-meals/<plik>.dump.age . --endpoint-url <endpoint>
#   age -d -i <klucz-prywatny.txt> -o <plik>.dump <plik>.dump.age
#   pg_restore --clean --if-exists --no-owner -d "$DATABASE_URL" <plik>.dump
name: DB backup

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RETENTION_DAYS: '30'
      PREFIX: weekly-meals
    # Tymczasowa baza do próby odtworzenia — żyje tylko w tym przebiegu.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: restorecheck
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d restorecheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Runner ma preinstalowanego klienta 16 i to on wygrywa na PATH
          # (`pg_dump` 16.15 odmawia zrzutu z serwera 17.11 — „server version
          # mismatch"). Katalog wersji 17 idzie na początek ścieżki dla
          # WSZYSTKICH kolejnych kroków (pg_dump i pg_restore).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Guard secrets
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for v in DATABASE_PUBLIC_URL R2_BACKUP_ENDPOINT R2_BACKUP_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v:-}" ]; then echo "::error::brak sekretu $v"; exit 1; fi
          done

      - name: pg_dump
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          file="weekly-meals-${stamp}.dump"
          # Format custom: skompresowany, odtwarzalny wybiórczo przez pg_restore.
          pg_dump --format=custom --no-owner --no-privileges \
            --file "$file" "$DATABASE_PUBLIC_URL"
          size=$(stat -c %s "$file")
          # Pusta albo śladowa kopia to porażka, nie sukces — lepiej czerwony
          # workflow niż cichy „backup", którego nie da się odtworzyć.
          if [ "$size" -lt 20000 ]; then echo "::error::zrzut ma tylko $size B"; exit 1; fi
          echo "FILE=$file" >> "$GITHUB_ENV"
          echo "zrzut: $file ($size B)"

      # Zrzut, którego pg_restore nie potrafi przeczytać, to nie kopia.
      # Listing spisu treści sprawdza format i sumy bez dotykania bazy.
      - name: Verify dump is restorable
        run: |
          set -euo pipefail
          FILE="$(ls weekly-meals-*.dump | head -n 1)"
          # Listing do pliku, nie przez potok: `head` zamyka potok po pięciu
          # liniach, pg_restore dostaje „Broken pipe", a `pipefail` uznaje to
          # za porażkę weryfikacji poprawnego zrzutu.
          pg_restore --list "$FILE" > toc.txt
          ENTRIES=$(grep -c -v '^;' toc.txt || true)
          head -n 6 toc.txt
          echo "OK: $ENTRIES wpisów w spisie treści"
          if [ "$ENTRIES" -lt 50 ]; then
            echo "::error::spis treści zrzutu ma tylko $ENTRIES wpisów — to nie jest pełna baza"
            exit 1
          fi
          rm -f toc.txt

      # Prawdziwa próba: odtworzenie do pustej bazy i policzenie, co weszło.
      # Format custom + `--no-owner` pozwalają odtworzyć bez ról z Railway.
      - name: Restore check
        env:
          CHECK_URL: postgresql://restore:restore@localhost:5432/restorecheck
        run: |
          set -euo pipefail
          pg_restore --no-owner --no-privileges --exit-on-error -d "$CHECK_URL" "$FILE"
          TABLES=$(psql "$CHECK_URL" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          USERS=$(psql "$CHECK_URL" -Atc 'select count(*) from "User"')
          RECIPES=$(psql "$CHECK_URL" -Atc 'select count(*) from "Recipe"')
          echo "odtworzono: tabel=$TABLES kont=$USERS przepisów=$RECIPES"
          if [ "$TABLES" -lt 20 ] || [ "$USERS" -lt 1 ]; then
            echo "::error::odtworzona baza jest niekompletna (tabel=$TABLES, kont=$USERS)"
            exit 1
          fi

      # Zrzut = dane osobowe. Szyfrowanie kluczem publicznym age; deszyfruje
      # tylko klucz prywatny spoza GitHuba i Cloudflare.
      - name: Encrypt dump
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_AGE_PUBLIC_KEY:-}" ]; then
            echo "::warning::brak sekretu BACKUP_AGE_PUBLIC_KEY — zrzut idzie na R2 NIEZASZYFROWANY"
            exit 0
          fi
          sudo apt-get install -y -qq age >/dev/null
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o "$FILE.age" "$FILE"
          rm -f "$FILE"
          echo "FILE=$FILE.age" >> "$GITHUB_ENV"
          echo "zaszyfrowano: $FILE.age ($(stat -c %s "$FILE.age") B)"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "$FILE" "s3://$R2_BACKUP_BUCKET/$PREFIX/$FILE" \
            --endpoint-url "$R2_BACKUP_ENDPOINT" --only-show-errors
          aws s3 ls "s3://$R2_BACKUP_BUCKET/$PREFIX/$FILE" --endpoint-url "$R2_BACKUP_ENDPOINT"

      - name: Prune copies older than retention
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H%M%SZ)
          aws s3 ls "s3://$R2_BACKUP_BUCKET/$PREFIX/" --endpoint-url "$R2_BACKUP_ENDPOINT" \
            | awk '{print $4}' | grep -E '^weekly-meals-.*\.dump(\.age)?
              if [[ "$stamp" < "$cutoff" ]]; then
                echo "usuwam $name"
                aws s3 rm "s3://$R2_BACKUP_BUCKET/$PREFIX/$name" --endpoint-url "$R2_BACKUP_ENDPOINT" --only-show-errors
              fi
            done

      - name: Shred local dump
        if: always()
        run: rm -f weekly-meals-*.dump weekly-meals-*.dump.age

      # Cicha porażka nocnej kopii to brak kopii, o którym nikt nie wie.
      # Ten sam webhook, co alerty serwera (`OPS_ALERT_WEBHOOK_URL`) —
      # sekret opcjonalny: bez niego krok tylko loguje.
      - name: Alert on failure
        if: failure()
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          MSG="Weekly Meals: nocna kopia bazy NIE powiodła się (${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}). ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -z "${OPS_ALERT_WEBHOOK_URL:-}" ]; then
            echo "::warning::$MSG (brak sekretu OPS_ALERT_WEBHOOK_URL — alert tylko tutaj)"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$(printf '{"content":"%s","text":"%s"}' "$MSG" "$MSG")" \
            "$OPS_ALERT_WEBHOOK_URL" >/dev/null
 | while read -r name; do
              stamp="${name#weekly-meals-}"; stamp="${stamp%.age}"; stamp="${stamp%.dump}"
              if [[ "$stamp" < "$cutoff" ]]; then
                echo "usuwam $name"
                aws s3 rm "s3://$R2_BACKUP_BUCKET/$PREFIX/$name" --endpoint-url "$R2_BACKUP_ENDPOINT" --only-show-errors
              fi
            done

      - name: Shred local dump
        if: always()
        run: rm -f weekly-meals-*.dump

      # Cicha porażka nocnej kopii to brak kopii, o którym nikt nie wie.
      # Ten sam webhook, co alerty serwera (`OPS_ALERT_WEBHOOK_URL`) —
      # sekret opcjonalny: bez niego krok tylko loguje.
      - name: Alert on failure
        if: failure()
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          MSG="Weekly Meals: nocna kopia bazy NIE powiodła się (${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}). ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -z "${OPS_ALERT_WEBHOOK_URL:-}" ]; then
            echo "::warning::$MSG (brak sekretu OPS_ALERT_WEBHOOK_URL — alert tylko tutaj)"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$(printf '{"content":"%s","text":"%s"}' "$MSG" "$MSG")" \
            "$OPS_ALERT_WEBHOOK_URL" >/dev/null
