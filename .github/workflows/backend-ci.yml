name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weeklymeals
          POSTGRES_USER: weeklymeals
          POSTGRES_PASSWORD: weeklymeals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weeklymeals -d weeklymeals"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://weeklymeals:weeklymeals@localhost:5432/weeklymeals?schema=public
      JWT_SECRET: ci-secret
      REFRESH_TOKEN_PEPPER: ci-pepper
      AUTH_DEV_LOGIN_ENABLED: "true"
      APNS_ENABLED: "false"
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Lint
        run: pnpm lint:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Smoke E2E
        run: pnpm test:e2e:ci
