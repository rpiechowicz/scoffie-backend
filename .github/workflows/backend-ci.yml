name: Backend CI

on:
  pull_request:
  # Tylko `main`. Wcześniej były tu też `develop` i `master`, przez co każdy
  # pull request z develop biegł DWA razy: raz ze zdarzenia push, raz
  # z pull_request. Ten sam zestaw testów, ten sam Postgres, podwójny rachunek
  # za minuty. `master` w tym repozytorium nie istnieje.
  push:
    branches:
      - main

# Token joba tylko do odczytu: instalacja zależności nie może pisać do repo.
permissions:
  contents: read

# Trzy pushe do PR-a = jeden bieg, nie trzy równoległe z Postgresem.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skaner sekretów (klucze API, tokeny, hasła) w zmianach — zamiennik płatnej
  # ochrony GitHuba dla prywatnych repozytoriów. Czerwony = merge stoi.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Przy pull requeście akcja czyta listę commitów PR-a przez API —
      # bez tego uprawnienia kończy się 403 „Resource not accessible".
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scoffie
          POSTGRES_USER: scoffie
          POSTGRES_PASSWORD: scoffie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoffie -d scoffie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://scoffie:scoffie@localhost:5432/scoffie?schema=public
      JWT_SECRET: ci-secret
      REFRESH_TOKEN_PEPPER: ci-pepper
      AUTH_DEV_LOGIN_ENABLED: 'true'
      OPS_TOKEN: ci-ops-token
      # E2E biegnie w trybie docelowym; przypadki legacy przełączają tryb same.
      WS_AUTH_MODE: strict
      APNS_ENABLED: 'false'
      CORS_ORIGIN: http://localhost:5173
      # Sztuczny klucz 32 B (base64) — CookidooIntegrationService robi fail-fast
      # przy starcie appki, a smoke e2e bootuje cały AppModule.
      COOKIDOO_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Znane podatności w zależnościach produkcyjnych. Dependabot otwiera PR-y
      # z poprawkami, ale dopiero czerwony bieg zatrzymuje merge kodu, który
      # wozi dziurawy pakiet. `high` i wyżej — `moderate` bywa hałasem.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Lint
        run: pnpm lint:check

      # Spec-i nie wchodzą do `pnpm build` (tsconfig.build.json je wyklucza),
      # a ts-jest z `isolatedModules` nie sprawdza typów — bez tego kroku spec
      # z sygnaturą sprzed refaktoru dalej świeci na zielono.
      - name: Typecheck (src + test + scripts, incl. specs)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Smoke E2E
        run: pnpm test:e2e:ci
