# Aktualizacje zależności jako PR-y do `develop` — raz w tygodniu, zgrupowane,
# żeby nie zalewać telefonu. Poprawki bezpieczeństwa Dependabot otwiera od
# razu, niezależnie od harmonogramu.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      minor-and-patch:
        update-types: ['minor', 'patch']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
