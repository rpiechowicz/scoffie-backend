services:
  db:
    image: postgres:16
    container_name: weeklymeals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weeklymeals
      POSTGRES_PASSWORD: weeklymeals
      POSTGRES_DB: weeklymeals
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weeklymeals -d weeklymeals"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: weeklymeals-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://weeklymeals:weeklymeals@db:5432/weeklymeals?schema=public
      JWT_SECRET: dev-secret-change-me
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "3000:3000"
      - "5555:5555"

volumes:
  pgdata:
