name: scoffie

services:
  db:
    image: postgres:17
    container_name: scoffie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoffie
      POSTGRES_PASSWORD: scoffie
      POSTGRES_DB: scoffie
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scoffie -d scoffie']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: scoffie-api
    depends_on:
      db:
        condition: service_healthy
      cookidoo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Obraz ma NODE_ENV=production (Dockerfile), a `assert-env.ts` odmawia
      # wtedy startu przy AUTH_DEV_LOGIN_ENABLED=true i pustym OPS_TOKEN —
      # czyli przy domyślnych wartościach z `.env.example`. Compose to stack
      # deweloperski, więc prostuje to jawnie.
      NODE_ENV: development
      DATABASE_URL: postgresql://scoffie:scoffie@db:5432/scoffie?schema=public
      # Inline jak DATABASE_URL: w composie hostname to nazwa usługi, a .env
      # trzyma localhost:8000 dla api odpalanego z hosta.
      COOKIDOO_SERVICE_URL: http://cookidoo:8000
    ports:
      - '3000:3000'
      - '5555:5555'

  # Mikroserwis Cookidoo (Thermomix) — repo scoffie-cookidoo sklonowane
  # obok tego repa (kontekst builda ../scoffie-cookidoo).
  cookidoo:
    build: ../scoffie-cookidoo
    container_name: scoffie-cookidoo
    restart: unless-stopped
    environment:
      INTERNAL_TOKEN: ${COOKIDOO_SERVICE_TOKEN}

volumes:
  pgdata:
